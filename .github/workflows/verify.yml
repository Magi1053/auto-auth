name: Verify Auto-Auth
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: read
jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests and both distributions
        shell: bash
        run: bash gradlew :common:test :fabric:build :neoforge:build verifyArtifacts --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: common/build/test-results/test/*.xml
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install graphical test runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Test actual clients and packaged distributions
        run: xvfb-run -a bash gradlew :fabric:clientTest :neoforge:clientTest :fabric:packagedClientTest :neoforge:packagedClientTest --no-parallel --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-results
          path: |
            .tmp/agent-game-test/**/results.txt
            .tmp/agent-game-test/**/runtime-tests.xml
            .tmp/agent-game-test/**/failure.png
          include-hidden-files: true
